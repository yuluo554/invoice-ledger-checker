[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-ledger-checker"
version = "0.1.0"
description = "电子发票智能台账与重复报销检测桌面应用：数电票 XML/版式 PDF 解析、本地 SQLite 台账、规则引擎异常检测、全离线运行"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "yuluo554" }]
keywords = ["invoice", "e-invoice", "expense", "audit", "ledger", "desktop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
# 核心零第三方依赖：解析（非 XML/OFD）、生成、GUI、导出全部走 extras 惰性导入
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
parse = ["pdfplumber>=0.10"]
# reportlab 版本策略（M6 干净环境实测，两个方向都踩过）：
#   py<3.9 锁 <4 —— 4.x 的 hashlib.md5(usedforsecurity=False) 是 py3.9 才有的参数，
#     3.8 上 generate 直接 TypeError（README 步骤与 CI 的 win-3.8 作业同挂）；
#   py>=3.9 放开 —— 3.6.13 在 3.12 装不起来（无 wheel、sdist 构建失败），单一上界不可行。
# 入仓冻结数据集由 3.6.13 产出：PDF 字节比对只在 reportlab 3.x 环境生效
# （tests/test_generator.py 按主版本收敛，XML/OFD/真值仍全量守门）
data = [
    "reportlab>=3.6,<4; python_version < '3.9'",
    "reportlab>=3.6; python_version >= '3.9'",
]
export = ["openpyxl>=3.1"]
report = ["python-docx>=0.8.11"]
# QtCharts 位于 PySide6-Addons，必须显式声明（extras 覆盖真实 import 纪律）
# M5 实测复核（2026-10-06）：6.6.3.1 发 cp38-abi3 wheel 且为 <6.7 内最新可解析版（6.7+ requires-python>=3.9）
desktop = [
    "PySide6>=6.5,<6.7; python_version < '3.9'",
    "PySide6>=6.5; python_version >= '3.9'",
    "PySide6-Addons>=6.5,<6.7; python_version < '3.9'",
    "PySide6-Addons>=6.5; python_version >= '3.9'",
]
# 打包子集：独立 extra（不进 all），仅打包机/发布环境安装（CI 测试矩阵保持精简）
pack = ["pyinstaller>=6,<7"]
all = [
    "invoice-ledger-checker[dev,parse,data,export,report,desktop]",
]

[project.scripts]
invoice-ledger = "invoice_ledger_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
