name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # win-3.8 镜像开发机环境（最能抓环境差异），ubuntu-3.12 验前向兼容
          - { os: windows-latest, python: "3.8" }
          - { os: windows-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package with dev extras
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest

  desktop:
    # M5 桌面交付回归门：本作业显式装 desktop+export extras，使 GUI（offscreen）
    # 与 Excel 导出测试**真正执行**而非模块级跳过——主 test 作业只装 dev，
    # test_app.py 会整体 skip（收集数 -10）。两作业职责分离（同 benchmark 作业）。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install package with desktop+export extras
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,parse,data,export,desktop]"
      - name: Run full tests (GUI offscreen: QT_QPA_PLATFORM set in test module)
        run: python -m pytest

  benchmark:
    # M4 回归纪律：改数据/改规则/改接口 -> 基准门槛不回退（F1>=0.95、检出率
    # 100%、误报 0）。win-3.8 镜像开发机同环境；需 parse+data extras 解析
    # 冻结 PDF 样本（门槛未达退出码 1 即失败）。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install package with parse+data extras
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,parse,data]"
      - name: Run benchmark gates
        run: python -m invoice_ledger_checker benchmark --no-report
